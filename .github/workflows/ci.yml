name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: swoole
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage
