name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole
      - name: Verify Swoole version
        run: php -r 'if (version_compare(SWOOLE_VERSION, "6.0.0", "<")) { fwrite(STDERR, "Swoole >= 6.0 required\n"); exit(1); }'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage
