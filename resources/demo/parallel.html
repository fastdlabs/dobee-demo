<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD Parallel Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>Swoole 协程并发</h1>
<p>同一个 <code>Parallel::all()</code> 调用：CGI 串行，Swoole 协程并发。</p>
<button onclick="run()">请求 /parallel-demo</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(){
  const out=document.getElementById('out');
  const started=performance.now();
  const r=await fetch('/parallel-demo');
  const body=await r.json();
  body.client_elapsed_ms=Math.round(performance.now()-started);
  out.textContent=JSON.stringify(body,null,2);
}
</script>
</body>
</html>
