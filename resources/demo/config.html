<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD Config Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>配置 / 运行时</h1>
<button onclick="run()">请求 /config-demo</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(){const r=await fetch('/config-demo');document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);}
</script>
</body>
</html>
