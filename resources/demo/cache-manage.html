<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD Cache Manage Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>Cache 管理</h1>
<p>演示 set / get / delete / miss。</p>
<button onclick="run('set')">Set</button>
<button onclick="run('get')">Get</button>
<button onclick="run('delete')">Delete</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(action) {
  const r = await fetch('/cache-manage-demo?action=' + action);
  document.getElementById('out').textContent = 'HTTP ' + r.status + '\n' + JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
