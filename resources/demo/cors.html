<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD CORS Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>CORS / OPTIONS</h1>
<p><code>CorsDemoMiddleware</code> 处理预检并附加 CORS 响应头。</p>
<button onclick="run()">GET /cors-demo</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(){
  const r=await fetch('/cors-demo',{headers:{'Origin':'https://demo.example','X-Demo':'cors'}});
  document.getElementById('out').textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2);
}
</script>
</body>
</html>
