<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD Cookie Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>Cookie 演示</h1>
<p>连续请求两次，观察 <code>demo_visits</code> 累加。</p>
<button onclick="run()">请求两次 /cookie-demo</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(){
  const first=await (await fetch('/cookie-demo')).json();
  const second=await (await fetch('/cookie-demo')).json();
  document.getElementById('out').textContent=JSON.stringify({first,second},null,2);
}
</script>
</body>
</html>
