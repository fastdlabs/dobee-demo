<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FastD Error Demo</title></head>
<body style="font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:32px">
<h1>异常处理</h1>
<p>异常由路由级 <code>ExceptionDemoMiddleware</code> 转换为统一 JSON。</p>
<button onclick="run('not_found')">404 Not Found</button>
<button onclick="run('exception')">500 Exception</button>
<pre id="out" style="background:#0b1220;padding:16px;border-radius:8px">-</pre>
<p><a style="color:#38bdf8" href="/demo/index.html">返回 Demo 首页</a></p>
<script>
async function run(type){
  const r=await fetch('/error-demo?type='+type);
  document.getElementById('out').textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2);
}
</script>
</body>
</html>
